[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-agent"
version = "0.1.0"
description = "LLM-agnostic agent that triages scientific ideas against first principles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
science-agent = "science_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
science_agent = ["prompts/*.md", "knowledge/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
