# Pandora on the DGX Spark, shared through Tailscale. Copy to config.yaml next to
# docker-compose.yml and fill in the three places marked TODO.

llm:
  provider: openai_compatible
  base_url: http://192.168.2.84:8008/v1   # vLLM container on the Spark
  # TODO: the exact model id vLLM serves; list it with: curl -s http://192.168.2.84:8008/v1/models
  model: nvidia/Qwen3.6-35B-A3B-NVFP4
  json_mode: true
  max_tokens: 24576   # reasoning models count their thinking; 8192 ran out in the compute stage
  timeout: 900

# Optional: give one stage its own limits. The compute prompt is long and a reasoning model can
# think for a quarter of an hour before it writes the script; a shorter limit makes a stuck
# call fail fast, and "Resume" then continues from the saved steps.
# stages:
#   compute:
#     max_tokens: 12000
#     timeout: 420

literature:
  enabled: true
  max_results: 5
  semantic_scholar_api_key_env: S2_API_KEY   # set S2_API_KEY in .env next to docker-compose.yml

compute:
  enabled: true
  timeout: 60
  sandbox_url: unix:///run/sandbox/sandbox.sock   # the isolated runner container (no network)

output_dir: /data/reports

server:
  mode: shared
  # TODO: your Tailscale login (shown in the Tailscale admin console under Users).
  admins:
    - you@example.com
  # TODO: the https address that "tailscale serve" prints, e.g. https://thinkstationpgx-afbe.tail1234.ts.net
  allowed_origins:
    - https://thinkstationpgx-afbe.YOUR-TAILNET.ts.net
  max_runs_per_user: 2
  # Guests may save their own endpoint and API key (encrypted on the server) and run with them.
  # Only public https endpoints are accepted. A host that is only reachable internally (a
  # university API, for example) has to be allowed here by name.
  guests_may_use_own_api: true
  # "host" allows every port, "host:port" only that one. The vLLM entry makes the guests' preset
  # "DGX Spark (vLLM)" work; nothing else on the Spark is reachable for guests.
  guest_allowed_hosts:
    - "192.168.2.84:8008"        # add e.g. api.ai.rh-koeln.de if that API is only reachable internally
  guest_max_tokens: 64000
  guest_max_timeout: 600         # seconds per model call
  external_workers: 3            # runs on guests' own APIs that may run side by side
